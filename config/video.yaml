%YAML:1.0
---
# 当前支持 images；video 预留，尚未实现视频解码。
mode: "images"
# 路径相对于本 YAML 所在目录；也可填写绝对路径。
# 例：../Input/InputImage/left.bmp；从 build 运行时请显式传入源目录的 YAML。
# TODO: 填写实际左右相机图片，保留各自原始分辨率，不缩放、不裁剪。
left_camera:
   path: ""
right_camera:
   path: ""
# 左右每侧的帧数上限；单侧队满时仅丢弃该侧最旧帧。
queue_capacity: 4
# 1：每次 captureNext() 重复生成一对；0：仅生成一对，随后返回结束。
# 采集节奏由调用方控制；timestamp_ms 是共同单调时钟的采集时间。
repeat: 1
